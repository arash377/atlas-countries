name: Publish country content
# Enable Settings > Pages > GitHub Actions for the first deployment.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare public content
        run: |
          mkdir -p build/pages
          cp -R data assets region-map.json index.html .nojekyll build/pages/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
